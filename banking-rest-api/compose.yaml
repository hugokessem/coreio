services:
  postgres:
    image: postgres:18-alpine
    container_name: cbe-banking-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cbe_banking
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cbe_banking"]
      interval: 5s
      timeout: 5s
      retries: 5

  banking-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cbe-banking-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: cbe_banking
      DB_LOGGING: "false"
      JWT_SECRET: "cbe-coreio-super-secret-production-banking-key-2026"
      API_KEY: "cbe-banking-api-key-default-2026"
      SWAGGER_ENABLED: "true"
    ports:
      - "3000:3000"

volumes:
  pgdata:
